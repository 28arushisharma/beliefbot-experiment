name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys rather than cancelling one partway through an ECS rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job assume the AWS role through GitHub OIDC

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::310867200447:role/beliefbot-experiment-deploy
  ECR_REPOSITORY: otree
  ECS_CLUSTER: confirmationbias-Cluster-ZXaPqMqykOvu
  ECS_SERVICE: confirmationbias-otree

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # With no `context`, this builds from the commit that triggered the run,
      # so no checkout step is needed and .git stays out of the image.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The task definition uses the untagged image (:latest), so a forced
      # deployment is enough to start tasks on the image pushed above.
      - name: Restart ECS service
        run: |
          deployment_id=$(aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query "service.deployments[?status=='PRIMARY'] | [0].id" \
            --output text)
          echo "Started deployment $deployment_id"

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

          # The service has a rollback circuit breaker, and a rolled-back service
          # also reports stable, so check that this deployment is the one running.
          primary_id=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].id" \
            --output text)
          if [ "$primary_id" != "$deployment_id" ]; then
            echo "::error::Deployment $deployment_id was rolled back; $primary_id is now primary"
            exit 1
          fi
